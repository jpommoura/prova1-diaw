<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatos - Eleições 2026 - MG</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="topo">
    <h1>Candidatos - Eleições 2026 - MG</h1>
</header>

<main class="conteudo">

    <form method="get" th:action="@{/}" class="filtros">
        <div class="campo">
            <label for="texto">Buscar por nome / número</label>
            <input type="text" id="texto" name="texto" placeholder="Ex: Ana, 1240..."
                   th:value="${textoSelecionado}">
        </div>

        <div class="campo">
            <label for="cargo">Cargo</label>
            <select id="cargo" name="cargo">
                <option value="">Todos</option>
                <option th:each="c : ${cargos}"
                        th:value="${c}"
                        th:text="${c}"
                        th:selected="${c == cargoSelecionado}"></option>
            </select>
        </div>

        <div class="campo">
            <label for="partido">Partido</label>
            <select id="partido" name="partido">
                <option value="">Todos</option>
                <option th:each="p : ${partidos}"
                        th:value="${p}"
                        th:text="${p}"
                        th:selected="${p == partidoSelecionado}"></option>
            </select>
        </div>

        <button type="submit">Filtrar</button>
        <a th:href="@{/}" class="limpar">Limpar</a>
    </form>

    <p class="contagem" th:if="${total > 0}" th:text="${total} + ' candidato(s) encontrado(s).'"></p>
    <p class="vazio" th:if="${total == 0}">Nenhum candidato encontrado.</p>

    <div class="grade-candidatos">
        <div class="card" th:each="cand : ${candidatos}">
            <img th:src="@{'/images/candidatos/' + ${cand.nomeArquivoFoto}}"
                 th:alt="${cand.nomeUrna}"
                 class="foto-candidato"
                 onerror="this.onerror=null; this.src='/images/candidatos/sem-foto.jpg'">

            <div class="info">
                <h2 class="nome" th:text="${cand.nomeUrna}"></h2>
                <p class="numero">Número: <span th:text="${cand.nrCandidato}"></span></p>
                <p class="cargo" th:text="${cand.cargo}"></p>
                <p th:text="${cand.siglaPartido} + ' - ' + ${cand.nomePartido}"></p>
                <p th:text="${cand.municipio}"></p>
                <p th:if="${cand.idade >= 0}" th:text="${cand.idade} + ' anos'"></p>
                <p th:if="${cand.situacaoCandidatura != '' and cand.situacaoCandidatura != '#NE'}"
                   th:text="${cand.situacaoCandidatura}"></p>
                <p th:if="${cand.ocupacao != '' and cand.ocupacao != '#NE'}" th:text="${cand.ocupacao}"></p>
                <p th:if="${cand.grauInstrucao != '' and cand.grauInstrucao != '#NE'}" th:text="${cand.grauInstrucao}"></p>
                <p class="nome-civil" th:text="${cand.nomeCandidato}"></p>
            </div>
        </div>
    </div>

</main>

</body>
</html>
